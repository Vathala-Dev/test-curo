import type { ImageResponseOptions } from "next/server";

export const size = { width: 32, height: 32 };
export const contentType = "image/png";

export default function Icon() {
  return new Response(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#2563EB"/><text x="16" y="22" text-anchor="middle" fill="white" font-size="18" font-family="Arial,sans-serif" font-weight="bold">C</text></svg>`,
    { headers: { "Content-Type": "image/svg+xml" } }
  );
}
